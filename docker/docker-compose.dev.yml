services:
  db:
    image: postgres:15
    container_name: star-burger-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: star-burger-backend
    volumes:
      - ./backend:/star-burger/backend
      - static_data:/star-burger/backend/staticfiles
      - media_data:/star-burger/backend/media
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: >
      sh -c "until pg_isready -h db -p 5432; do echo 'Waiting for database...'; sleep 2; done &&
            python manage.py migrate &&
            python manage.py loaddata data.json &&
            python manage.py collectstatic --noinput &&
            gunicorn star_burger.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: star-burger-frontend
    volumes:
      - ./frontend/bundles:/star-burger/frontend/bundles
      - /star-burger/frontend/node_modules
    ports:
      - "1234:1234"
    environment:
      - ENVIRONMENT=dev
    command: npx parcel watch frontend/bundles-src/index.js --port 1234 --dist-dir frontend/bundles --public-url="./"

  nginx:
    build:
      context: ./docker
      dockerfile: Dockerfile.nginx
    container_name: star-burger-nginx
    ports:
      - "80:80"
    volumes:
      - static_data:/usr/share/nginx/html/static
      - media_data:/usr/share/nginx/html/media
      - ./frontend/bundles:/usr/share/nginx/html/bundles
    depends_on:
      - backend
      - frontend

volumes:
  static_data:
  media_data:
  postgres_data:

